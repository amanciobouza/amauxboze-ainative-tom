id: synthesize-strategic-insight
version: "0.1.0"
purpose: Synthesize evidence, patterns, and functional interpretations into a strategic insight.
inputs:
  type: object
  required: [pattern_analysis, product_interpretation, brand_interpretation, commercial_interpretation, customer_interpretation]
  properties:
    pattern_analysis: {type: object}
    product_interpretation: {type: object}
    brand_interpretation: {type: object}
    commercial_interpretation: {type: object}
    customer_interpretation: {type: object}
outputs:
  type: object
  required: [what_is_known, what_is_uncertain, why_it_matters, options]
  properties:
    what_is_known: {type: array, items: {type: string}}
    what_is_uncertain: {type: array, items: {type: string}}
    why_it_matters: {type: string}
    options: {type: array, items: {type: string}}
context: [Research/]
allowed_tools: [obsidian.read]
model:
  privacy: standard
  reasoning: high
  creativity: low
  coding: false
  preferred_providers: [openai, anthropic, lm_studio]
approval_required: false
