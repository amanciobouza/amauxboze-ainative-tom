id: interpret-commercial-impact
version: "0.1.0"
purpose: Interpret market signals from a commerce, pricing, and growth perspective.
inputs:
  type: object
  required: [pattern_analysis, observations]
  properties:
    pattern_analysis: {type: object}
    observations: {type: object}
outputs:
  type: object
  required: [implications, risks, opportunities]
  properties:
    implications: {type: array, items: {type: string}}
    risks: {type: array, items: {type: string}}
    opportunities: {type: array, items: {type: string}}
context: [Commerce/]
allowed_tools: [obsidian.read]
model:
  privacy: standard
  reasoning: high
  creativity: low
  coding: false
  preferred_providers: [openai, anthropic, lm_studio]
approval_required: false
