id: define-launch-brief
version: "0.1.0"
purpose: Turn an approved product specification and launch objective into a structured launch brief.
inputs:
  type: object
  required: [product_specification, launch_objective]
  properties:
    product_specification: {type: object}
    launch_objective: {type: string}
outputs:
  type: object
  required: [objective, milestones, dependencies, open_decisions]
  properties:
    objective: {type: string}
    milestones: {type: array, items: {type: string}}
    dependencies: {type: array, items: {type: string}}
    open_decisions: {type: array, items: {type: string}}
context: [Organization/, Products/]
allowed_tools: [obsidian.read]
model:
  privacy: standard
  reasoning: medium
  creativity: low
  coding: false
  preferred_providers: [lm_studio, openai, anthropic]
approval_required: false
