id: review-commercial-fit
version: "0.1.0"
purpose: Assess pricing, positioning, and launch feasibility of a watch concept.
inputs:
  type: object
  required: [concept, evidence_pack]
  properties:
    concept: {type: object}
    evidence_pack: {type: object}
outputs:
  type: object
  required: [pricing_view, commercial_risks, positioning_implications]
  properties:
    pricing_view: {type: string}
    commercial_risks: {type: array, items: {type: string}}
    positioning_implications: {type: array, items: {type: string}}
context:
  - Commerce/
allowed_tools:
  - obsidian.read
  - shopify.read
model:
  privacy: standard
  reasoning: high
  creativity: low
  coding: false
  preferred_providers: [openai, anthropic, lm_studio]
approval_required: false
