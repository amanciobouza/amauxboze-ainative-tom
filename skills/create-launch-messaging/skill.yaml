id: create-launch-messaging
version: "0.1.0"
purpose: Create the core launch narrative and message hierarchy from the Product Truth Pack.
inputs:
  type: object
  required: [product_truth_pack]
  properties:
    product_truth_pack: {type: object}
outputs:
  type: object
  required: [core_message, supporting_messages, narrative_frame]
  properties:
    core_message: {type: string}
    supporting_messages: {type: array, items: {type: string}}
    narrative_frame: {type: string}
context: [Brand/]
allowed_tools: [obsidian.read]
model:
  privacy: standard
  reasoning: high
  creativity: high
  coding: false
  preferred_providers: [anthropic, openai, lm_studio]
approval_required: false
