[project]
name = "amauxboze-ainative"
version = "0.1.0"
description = "AI-native operating system for Amaux Bozé"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.34.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "anthropic>=0.72.0",
  "httpx>=0.28.0",
  "langgraph>=0.6.0",
  "openai>=2.0.0",
  "pydantic>=2.11.0",
  "python-dotenv>=1.1.0",
  "PyYAML>=6.0.2"
]

[project.optional-dependencies]
dev = [
  "playwright>=1.50.0",
  "pytest>=8.4.0",
  "pytest-cov>=6.2.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amauxboze"]
